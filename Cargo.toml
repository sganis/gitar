[package]
name = "gitar"
version = "1.0.8"
edition = "2021"
license = "MIT"
repository = "https://github.com/sganis/gitar"
homepage = "https://github.com/sganis/gitar"
description = "AI-powered Git assistant for commit messages, PRs, changelogs, and more"
keywords = ["git", "ai", "cli", "commit-message", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.13", features = ["json", "socks", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
toml = "0.9.8"
dirs = "6"
futures-util = "0.3.31"
regex = "1"
anstream = "0.6"
anstyle = "1"
dialoguer = "0.12"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serial_test = "3"