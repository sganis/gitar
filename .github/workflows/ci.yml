# .github/workflows/ci.yml
name: Gitar CI/CD

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # -------------------------
          # Linux x86_64 (glibc)
          # -------------------------
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg_os: linux
            pkg_arch: x86_64
            artifact_ext: tar.gz
            binary_name: gitar

          # -------------------------
          # Linux x86_64 (musl - static)
          # -------------------------
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            pkg_os: linux
            pkg_arch: x86_64-musl
            artifact_ext: tar.gz
            binary_name: gitar

          # -------------------------
          # Linux aarch64 (ARM)
          # -------------------------
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            pkg_os: linux
            pkg_arch: aarch64
            artifact_ext: tar.gz
            binary_name: gitar

          # -------------------------
          # macOS Apple Silicon
          # -------------------------
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg_os: macos
            pkg_arch: aarch64
            artifact_ext: tar.gz
            binary_name: gitar

          # # -------------------------
          # # macOS Intel
          # # -------------------------
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          #   pkg_os: macos
          #   pkg_arch: x86_64
          #   artifact_ext: tar.gz
          #   binary_name: gitar

          # -------------------------
          # Windows x86_64
          # -------------------------
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            pkg_os: windows
            pkg_arch: x86_64
            artifact_ext: zip
            binary_name: gitar.exe

          # -------------------------
          # Windows ARM64
          # -------------------------
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            pkg_os: windows
            pkg_arch: arm64
            artifact_ext: zip
            binary_name: gitar.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Get version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install cross (linux aarch64 only)
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: cargo install cross --locked

      - name: Install musl tools (linux musl only)
        if: ${{ runner.os == 'Linux' && matrix.target == 'x86_64-unknown-linux-musl' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build Rust project
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            cross build --release --target "${{ matrix.target }}"
          else
            cargo build --release --target "${{ matrix.target }}"
          fi

      - name: Test Rust project
        if: ${{ matrix.target != 'aarch64-unknown-linux-gnu' }}
        run: cargo test --release

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" dist/gitar
          ARTIFACT_NAME="gitar-${VERSION}-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}.${{ matrix.artifact_ext }}"
          (cd dist && tar -czf "$ARTIFACT_NAME" gitar)
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> $GITHUB_ENV

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" -Destination "dist/gitar.exe"
          $artifactName = "gitar-$env:VERSION-${{ matrix.pkg_os }}-${{ matrix.pkg_arch }}.${{ matrix.artifact_ext }}"
          Compress-Archive -Path "dist/gitar.exe" -DestinationPath "dist/$artifactName"
          "ARTIFACT_NAME=$artifactName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/gitar-*.tar.gz
            artifacts/**/gitar-*.zip
